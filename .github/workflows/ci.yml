name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (only if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.raahi --project-name raahi --platforms=android,ios,web
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
